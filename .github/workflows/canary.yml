name: Canary

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Set to true to publish a canary to GitHub Packages and run a registry install smoke.
        required: true
        default: "false"

permissions:
  contents: read

concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-packages:
    name: Verify and pack GitHub Packages canary
    outputs:
      version: ${{ steps.canary.outputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: npm

      - name: Install
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Check
        run: npm run check

      - name: Prepare canary version
        id: canary
        run: |
          version="$(node scripts/prepare-github-canary.mjs)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Prepared ${version}"

      - name: Build canary package
        run: npm run build

      - name: Pack canary package
        run: npm pack --json

      - name: Upload canary tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: github-packages-canary-${{ steps.canary.outputs.version }}
          path: "*.tgz"

      - name: Upload committed npm tooling manifests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: github-packages-canary-npm-${{ github.run_id }}-${{ steps.canary.outputs.version }}
          path: |
            .github/tooling/npm/package.json
            .github/tooling/npm/package-lock.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified canary archive
    needs: github-packages
    if: github.event.inputs.publish == 'true' && github.repository == 'Ponchia/bronto-annotations' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Setup GitHub Packages registry
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: '@ponchia'
          always-auth: true
      - name: Download committed npm tooling from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: github-packages-canary-npm-${{ github.run_id }}-${{ needs.github-packages.outputs.version }}
          path: ${{ runner.temp }}/canary-npm-tooling
      - name: Verify tooling manifests and install integrity-locked npm
        shell: bash
        run: |
          set -euo pipefail
          tooling="${RUNNER_TEMP}/canary-npm-tooling"
          # These hashes come from the reviewed files, never from build outputs.
          # Reject extra files (including .npmrc), directories and symlinks.
          node --input-type=module - "$tooling" <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readdirSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const directory = process.argv[2];
          const expected = {
            'package.json': 'f3da4c6a5ca38a06b39af2cdbcd25c83bfe55af0b24474410b77f8f44b3ff0f5',
            'package-lock.json': 'e58fffd9ee3b11355cea0a5bc227fdb4547aff233384f7e9c7ece9f00e6a3adf'
          };
          const entries = readdirSync(directory, { withFileTypes: true });
          assert.deepEqual(entries.map((entry) => entry.name).sort(), Object.keys(expected).sort(), 'Unexpected tooling artifact contents');
          assert.ok(entries.every((entry) => entry.isFile()), 'Tooling manifests must be regular files');
          for (const [file, digest] of Object.entries(expected)) {
            assert.equal(createHash('sha256').update(readFileSync(join(directory, file))).digest('hex'), digest, `${file}: tooling integrity mismatch`);
          }
          NODE
          npm ci --prefix "$tooling" --ignore-scripts --no-audit --no-fund
          export PATH="$tooling/node_modules/.bin:$PATH"
          hash -r
          test "$(command -v npm)" = "$tooling/node_modules/.bin/npm"
          test "$(realpath "$(command -v npm)")" = "$(realpath "$tooling/node_modules/npm/bin/npm-cli.js")"
          test "$(npm --version)" = "11.21.1"
          printf '%s\n' "$tooling/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Download verified archive from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: github-packages-canary-${{ needs.github-packages.outputs.version }}
          path: canary-package
      - name: Publish GitHub Packages canary
        run: |
          set -euo pipefail
          archives=(canary-package/*.tgz)
          test "${#archives[@]}" -eq 1
          npm publish --tag canary --registry https://npm.pkg.github.com --ignore-scripts "${archives[0]}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke:
    name: Verify registry consumer
    needs: [github-packages, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup GitHub Packages registry
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          registry-url: https://npm.pkg.github.com
          scope: '@ponchia'
          always-auth: true
      - name: Smoke registry consumer
        env:
          CANARY_VERSION: ${{ needs.github-packages.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/smoke-registry-consumer.mjs --version "$CANARY_VERSION" --registry https://npm.pkg.github.com --scope @ponchia
