name: Canary

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Set to true to publish a canary to GitHub Packages and run a registry install smoke.
        required: true
        default: "false"

permissions:
  contents: read

concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publishing-tooling:
    if: github.event.inputs.publish == 'true' && github.repository == 'Ponchia/bronto-annotations' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/publishing-tooling.yml

  github-packages:
    name: Verify and pack GitHub Packages canary
    outputs:
      version: ${{ steps.canary.outputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: npm

      - name: Install
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Check
        run: npm run check

      - name: Prepare canary version
        id: canary
        run: |
          version="$(node scripts/prepare-github-canary.mjs)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Prepared ${version}"

      - name: Build canary package
        run: npm run build

      - name: Pack canary package
        run: npm pack --json

      - name: Upload canary tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: github-packages-canary-${{ steps.canary.outputs.version }}
          path: "*.tgz"

  publish:
    name: Publish verified canary archive
    needs: [github-packages, publishing-tooling]
    if: github.event.inputs.publish == 'true' && github.repository == 'Ponchia/bronto-annotations' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Setup GitHub Packages registry
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          registry-url: https://npm.pkg.github.com
          scope: '@ponchia'
          always-auth: true
          package-manager-cache: false
      # Only the publisher's own files are checked out; no package code,
      # manifest or lifecycle script of this repository reaches this job.
      - name: Check out the source-locked publisher only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: publisher
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/source-publisher.mjs
            /scripts/extract-publisher-source.py
            /scripts/audit-publishing-tooling.mjs
            /tooling/publisher/
      - name: Prepare and audit the source-locked publisher
        run: |
          set -euo pipefail
          node publisher/scripts/source-publisher.mjs prepare "${RUNNER_TEMP}/annotations-publisher"
          node publisher/scripts/source-publisher.mjs audit "${RUNNER_TEMP}/annotations-publisher" "${RUNNER_TEMP}/publisher-audit.json"
      - name: Download verified archive from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: github-packages-canary-${{ needs.github-packages.outputs.version }}
          path: canary-package
      - name: Publish GitHub Packages canary
        run: |
          set -euo pipefail
          archives=(canary-package/*.tgz)
          test "${#archives[@]}" -eq 1
          node "${RUNNER_TEMP}/annotations-publisher/source/bin/npm-cli.js" publish --tag canary --registry https://npm.pkg.github.com --ignore-scripts "${archives[0]}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke:
    name: Verify registry consumer
    needs: [github-packages, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup GitHub Packages registry
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          registry-url: https://npm.pkg.github.com
          scope: '@ponchia'
          always-auth: true
      - name: Smoke registry consumer
        env:
          CANARY_VERSION: ${{ needs.github-packages.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/smoke-registry-consumer.mjs --version "$CANARY_VERSION" --registry https://npm.pkg.github.com --scope @ponchia
