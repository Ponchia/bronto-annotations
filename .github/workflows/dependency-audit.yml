name: Dependency Audit

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/tooling/npm/package.json
      - .github/tooling/npm/package-lock.json
      - .github/workflows/dependency-audit.yml
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit the complete locked dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          package-manager-cache: false
      - name: Install integrity-locked npm
        run: |
          set -euo pipefail
          tooling="${GITHUB_WORKSPACE}/.github/tooling/npm"
          npm ci --prefix "$tooling" --ignore-scripts --no-audit --no-fund
          export PATH="$tooling/node_modules/.bin:$PATH"
          hash -r
          test "$(command -v npm)" = "$tooling/node_modules/.bin/npm"
          test "$(realpath "$(command -v npm)")" = "$(realpath "$tooling/node_modules/npm/bin/npm-cli.js")"
          test "$(npm --version)" = "11.21.1"
          printf '%s\n' "$tooling/node_modules/.bin" >> "$GITHUB_PATH"
      # Audit both committed graphs without installing project dependencies.
      # The isolated CLI is integrity-locked; its install hooks are disabled.
      - name: Fail on high or critical advisories in either complete lockfile
        shell: bash
        run: |
          set -euo pipefail
          status=0
          npm audit --package-lock-only --ignore-scripts --include=dev --audit-level=high --json > npm-audit.json || status=1
          npm audit --prefix .github/tooling/npm --package-lock-only --ignore-scripts --include=dev --audit-level=high --json > npm-tooling-audit.json || status=1
          node --input-type=module <<'NODE' || status=1
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          for (const file of ['npm-audit.json', 'npm-tooling-audit.json']) {
            const report = JSON.parse(readFileSync(file, 'utf8'));
            assert.ok(report && typeof report === 'object' && !Array.isArray(report), `${file}: invalid audit response`);
            assert.equal(report.error, undefined, `${file}: audit service error`);
            for (const severity of ['high', 'critical']) {
              const count = report.metadata?.vulnerabilities?.[severity];
              assert.ok(Number.isInteger(count) && count >= 0, `${file}: missing ${severity} advisory count`);
              assert.equal(count, 0, `${file}: ${severity} advisories require review`);
            }
          }
          NODE
          exit "$status"
      - name: Retain all advisory severities and registry errors
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-audit-${{ github.run_id }}
          path: |
            npm-audit.json
            npm-tooling-audit.json
          retention-days: 14
