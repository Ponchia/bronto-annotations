# The default bounded properties already run in npm test on both supported CI
# lanes. This larger campaign adds new logged seeds without privileged tokens.
name: Property tests

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: 'Signed 32-bit replay seed; empty generates a fresh seed'
        required: false
        type: string
        default: ''
      runs:
        description: 'Cases per property (1–10000)'
        required: false
        type: string
        default: '5000'

permissions:
  contents: read

concurrency:
  group: properties-${{ github.ref }}
  cancel-in-progress: true

jobs:
  property-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts
      - name: Record bounded campaign configuration
        env:
          REQUESTED_SEED: ${{ inputs.seed }}
          REQUESTED_RUNS: ${{ inputs.runs }}
        run: |
          node --input-type=module <<'JS'
          import { randomInt } from 'node:crypto';
          import { mkdirSync, writeFileSync, appendFileSync } from 'node:fs';
          const integer = (raw, fallback, min, max, name) => {
            const text = raw || String(fallback);
            if (!/^-?\d+$/.test(text)) throw new Error(`${name} must be an integer`);
            const value = Number(text);
            if (!Number.isSafeInteger(value) || value < min || value > max)
              throw new Error(`${name} must be between ${min} and ${max}`);
            return value;
          };
          const seed = integer(process.env.REQUESTED_SEED, randomInt(-2147483648, 2147483648),
            -2147483648, 2147483647, 'seed');
          const runs = integer(process.env.REQUESTED_RUNS, 5000, 1, 10000, 'runs');
          mkdirSync('.tmp/property', { recursive: true });
          const record = { seed, runs, commit: process.env.GITHUB_SHA, node: process.version };
          writeFileSync('.tmp/property/configuration.json', JSON.stringify(record, null, 2) + '\n');
          appendFileSync(process.env.GITHUB_ENV, `FC_SEED=${seed}\nFC_RUNS=${runs}\n`);
          console.log(JSON.stringify(record));
          JS
      - name: Execute generated-input properties and mutation controls
        run: npm run test:property -- --reporter=default --reporter=json --outputFile=.tmp/property/results.json
      - name: Retain seeds, results and minimized failure details
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: property-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/property/*.json
          if-no-files-found: warn
          retention-days: 30
