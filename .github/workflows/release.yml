# Release is tag-driven and explicit. It triggers only on a pushed `v*` tag,
# never on a branch push or GitHub Release publication event. The publish job
# is protected by the `npm-publish` environment so a tag cannot reach npm until
# a maintainer approves the deployment in GitHub Actions.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

env:
  npm_config_fetch_retries: '5'
  npm_config_fetch_retry_mintimeout: '10000'
  npm_config_fetch_retry_maxtimeout: '120000'

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Verify tag commit is on main
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::release tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not reachable from origin/main"
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Check
        run: npm run check

      - name: Verify tag matches package.json version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi

  publish-preflight:
    name: Publish preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Capture publish preflight summary
        run: |
          set -euo pipefail
          npm pack --dry-run --json --ignore-scripts > "${RUNNER_TEMP}/pack.json"
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const path = require('node:path');
          const pack = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'pack.json'), 'utf8'))[0];
          console.log('## Publish preflight');
          console.log('');
          console.log(`Package: ${pack.name}@${pack.version}`);
          console.log(`Files: ${pack.files.length}`);
          console.log(`Packed size: ${pack.size} bytes`);
          console.log(`Unpacked size: ${pack.unpackedSize} bytes`);
          console.log(`Integrity: ${pack.integrity}`);
          console.log('');
          console.log('### Pack manifest');
          console.log('');
          for (const file of pack.files) console.log(`- ${file.path} (${file.size} B)`);
          NODE

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: publish-preflight
    environment: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org

      - name: Install npm with OIDC publish support
        # npm 11.5+ carries OIDC trusted publishing; @latest crossed to npm 12,
        # which refuses the node 22.14.0 this job pins (requires ^22.22.2), and
        # the v0.2.1 publish died on exactly that. Pin the major that supports
        # both OIDC and this job's node.
        run: npm install -g npm@^11.5.1

      - name: Install
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [ "$version" != "${version%%-*}" ]; then
            dist_tag=next
          else
            dist_tag=latest
          fi
          echo "Publishing $version to dist-tag '$dist_tag'"
          npm publish --ignore-scripts --provenance --access public --tag "$dist_tag"

      - name: Record npm registry state
        continue-on-error: true
        run: |
          set -uo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [ "$version" != "${version%%-*}" ]; then
            dist_tag=next
          else
            dist_tag=latest
          fi
          # npm publish can finish before public registry reads are consistent.
          # npm view caches an early 404 or an old latest dist-tag, so observe
          # fresh HTTP packuments instead of repeating cached CLI lookups.
          published=false
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 15 \
              -H 'Accept: application/json' -H 'Cache-Control: no-cache' \
              "https://registry.npmjs.org/@ponchia%2fannotations?run=${GITHUB_RUN_ID}&attempt=$attempt" \
              -o "${RUNNER_TEMP}/npm-registry.json" \
              && node scripts/verify-published-registry.mjs \
                "${RUNNER_TEMP}/npm-registry.json" "$version" "$dist_tag" \
                > "${RUNNER_TEMP}/npm-registry-confirmed.json" \
                2> "${RUNNER_TEMP}/npm-registry-last-error.log"; then
              published=true
              break
            fi
            echo "npm public metadata for $version ($dist_tag) has not propagated (attempt $attempt/20)."
            sleep 10
          done

          {
            echo ''
            echo '## npm registry state'
            echo ''
            if [ "$published" = true ]; then
              echo 'Registry version, dist-tag, integrity and tarball confirmed:'
              echo ''
              echo '```json'
              cat "${RUNNER_TEMP}/npm-registry-confirmed.json"
              echo '```'
            else
              echo '> npm publish succeeded, but fresh public registry metadata was not visible within the observation window.'
              echo ''
              echo 'Do not republish the immutable version based only on this read delay.'
              echo "Verify with a fresh cache: \`npm --cache=\$(mktemp -d) view @ponchia/annotations@$version version dist-tags --json\`."
              if [ -f "${RUNNER_TEMP}/npm-registry-last-error.log" ]; then
                echo ''
                echo 'Last metadata verifier error:'
                tail -n 6 "${RUNNER_TEMP}/npm-registry-last-error.log"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  release-notes:
    name: Publish GitHub release notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: publish-npm
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Extract the CHANGELOG section for this tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: node scripts/changelog-section.mjs "$REF_NAME" > "${RUNNER_TEMP}/release-body.md"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: ${{ runner.temp }}/release-body.md
          prerelease: ${{ contains(github.ref_name, '-') }}
