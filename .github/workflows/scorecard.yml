name: Scorecard

on:
  branch_protection_rule:
  push:
    branches:
      - main
  schedule:
    - cron: '37 4 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      # The pinned action writes both files before signing/publishing results.
      # Retain the local scan even if the external publication service fails.
      # Keep this job limited to Scorecard's approved actions (no run steps).
      - name: Retain Scorecard evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scorecard-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            scorecard.sarif
            results.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Scorecard SARIF
        if: always() && hashFiles('scorecard.sarif') != ''
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
        with:
          sarif_file: scorecard.sarif
