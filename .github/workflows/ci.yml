name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - 22

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: npm

      - name: Install
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Check
        run: npm run check

      - name: Verify common-workload placement quality
        if: matrix.node-version == 22
        run: npm run test:quality -- --output-dir browser-evidence/placement-quality

      - name: Verify packed upstream consumers
        if: matrix.node-version == 22
        run: npm run test:upstream -- --output-dir browser-evidence/upstream-chromium

      # Verify TypeScript 7 declarations in a real clean packed consumer on
      # both Node lanes. The checked-in compiler stays TypeScript 6 and the
      # minimum TypeScript 5.8 compatibility lane remains unchanged.
      - name: TypeScript 7 clean declaration consumer
        run: npm run test:compatibility:typescript7

      # Browser bundlers emit Worker assets differently in production than
      # during dev. Keep this explicit Vite production proof in the Node 22
      # lane without adding a second browser build to every Node 20 gate.
      - name: Verify bundled module Worker integration
        if: matrix.node-version == 22
        run: npm run test:browser:worker:production

      # Mermaid 12 requires Node >=22.12. Keep Mermaid 11 as the regular
      # Node 20-tested peer instead of raising this package's engine floor.
      # Real mobile Chromium touch input exercises the browser's
      # touch-action / pointercancel negotiation, not just synthetic pointer
      # events. Only editable circles suppress browser panning; background
      # swipes must keep the host diagram horizontally scrollable.
      - name: Verify mobile touch annotation editing
        if: matrix.node-version == 22
        run: npm run test:browser:touch

      - name: Mermaid 12 isolated browser compatibility
        if: matrix.node-version == 22
        run: npm run test:compatibility:mermaid12

      # Vitest 5 and jsdom 30 require Node >=22.22.2; keep the normal
      # Vitest 4 / jsdom 29 suite on both Node 20 and Node 22 unchanged.
      # Run all real unit tests in a disposable copy with newer test tools.
      - name: Vitest 5 and jsdom 30 isolated unit suite
        if: matrix.node-version == 22
        run: npm run test:compatibility:test-runners-next

      # A whole consuming application can test these exact compiled bytes
      # without an npm publication or a dependency on an unbuilt Git checkout.
      - name: Retain exact candidate package for isolated consumers
        if: matrix.node-version == 22
        run: |
          node scripts/build-package.mjs --verify
          mkdir -p browser-evidence/package
          npm pack --ignore-scripts --json --pack-destination browser-evidence/package > browser-evidence/package/pack.json
          node -e 'const cp=require("node:child_process"); const fs=require("node:fs"); fs.writeFileSync("browser-evidence/package/source.json", JSON.stringify({sourceRevision:cp.execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim(),tree:cp.execFileSync("git",["rev-parse","HEAD^{tree}"],{encoding:"utf8"}).trim(),publication:"unpublished CI candidate; verify archive integrity from pack.json"},null,2)+"\n")'

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-evidence-node-${{ matrix.node-version }}
          path: |
            .tmp/screenshots
            .tmp-packed-screenshots
            browser-evidence
          if-no-files-found: ignore
