name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - 22

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Check
        run: npm run check

      # Verify TypeScript 7 declarations in a real clean packed consumer on
      # both Node lanes. The checked-in compiler stays TypeScript 6 and the
      # minimum TypeScript 5.8 compatibility lane remains unchanged.
      - name: TypeScript 7 clean declaration consumer
        run: npm run test:compatibility:typescript7

      # Browser bundlers emit Worker assets differently in production than
      # during dev. Keep this explicit Vite production proof in the Node 22
      # lane without adding a second browser build to every Node 20 gate.
      - name: Verify bundled module Worker integration
        if: matrix.node-version == 22
        run: npm run test:browser:worker:production

      # Mermaid 12 requires Node >=22.12. Keep Mermaid 11 as the regular
      # Node 20-tested peer instead of raising this package's engine floor.
      - name: Mermaid 12 isolated browser compatibility
        if: matrix.node-version == 22
        run: npm run test:compatibility:mermaid12

      # Vitest 5 and jsdom 30 require Node >=22.22.2; keep the normal
      # Vitest 4 / jsdom 29 suite on both Node 20 and Node 22 unchanged.
      # Run all real unit tests in a disposable copy with newer test tools.
      - name: Vitest 5 and jsdom 30 isolated unit suite
        if: matrix.node-version == 22
        run: npm run test:compatibility:test-runners-next

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence-node-${{ matrix.node-version }}
          path: |
            .tmp/screenshots
            .tmp-packed-screenshots
          if-no-files-found: ignore
