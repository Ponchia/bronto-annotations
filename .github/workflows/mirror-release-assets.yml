# Maintainer-dispatched mirror of an ALREADY published package and its ORIGINAL
# verified provenance. This workflow never publishes npm, signs, creates a
# release, changes a tag, deletes an asset or overwrites conflicting bytes.
name: Mirror Verified Release Assets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing published immutable release tag, e.g. v0.8.2'
        required: true
        type: string
      upload:
        description: 'Add missing verified assets (false only verifies and reports the plan)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mirror-release-assets-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publishing-tooling:
    if: github.repository == 'Ponchia/bronto-annotations' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/publishing-tooling.yml

  mirror-assets:
    name: Verify original provenance and mirror release assets
    needs: publishing-tooling
    if: github.repository == 'Ponchia/bronto-annotations' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Reuse the existing required-maintainer-review boundary. This grants no
    # npm access: the only write here is to this repository's release assets.
    environment: npm-publish
    permissions:
      contents: write

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Validate existing immutable tag and source commit
        id: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          # Treat workflow_dispatch input only as a validated value. Never
          # interpolate the untrusted tag expression directly into shell code.
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo '::error::Expected an existing vX.Y.Z or vX.Y.Z-prerelease tag'
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          commit=$(git rev-parse 'FETCH_HEAD^{commit}')
          if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
            echo '::error::Mirror tag is not reachable from protected main'
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          tagged_version=$(git show "$commit:package.json" | node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).version')
          if [ "$version" != "$tagged_version" ]; then
            echo '::error::Tag version differs from immutable package.json'
            exit 1
          fi
          {
            echo "tag=$RELEASE_TAG"
            echo "version=$version"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare and audit the source-locked npm signature verifier
        run: |
          set -euo pipefail
          node scripts/source-publisher.mjs prepare "${RUNNER_TEMP}/annotations-publisher"
          node scripts/source-publisher.mjs audit "${RUNNER_TEMP}/annotations-publisher" "${RUNNER_TEMP}/publisher-audit.json"

      - name: Verify immutable public registry tarball bytes
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 25 \
            -H 'Cache-Control: no-cache' \
            "https://registry.npmjs.org/@ponchia%2fannotations?mirror=${GITHUB_RUN_ID}&attempt=${GITHUB_RUN_ATTEMPT}" \
            -o "${RUNNER_TEMP}/packument.json"
          # Check the immutable version rather than `latest`: a later release
          # may have legitimately advanced the dist-tag since this failure.
          node scripts/verify-published-version.mjs \
            "${RUNNER_TEMP}/packument.json" "$RELEASE_VERSION" \
            > "${RUNNER_TEMP}/confirmed-metadata.json"
          archive_url=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).tarball' \
            "${RUNNER_TEMP}/confirmed-metadata.json")
          curl --fail --silent --show-error --max-time 30 --max-filesize 33554432 \
            --proto '=https' "$archive_url" \
            -o "${RUNNER_TEMP}/published-package.tgz"
          node scripts/verify-published-tarball.mjs \
            "${RUNNER_TEMP}/confirmed-metadata.json" \
            "${RUNNER_TEMP}/published-package.tgz" \
            > "${RUNNER_TEMP}/verified-package-bytes.json"

      - name: Verify npm signatures and signed GitHub workflow identity
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/signature-consumer"
          cd "${RUNNER_TEMP}/signature-consumer"
          echo '{"name":"annotations-mirror-signature-check","private":true,"type":"module"}' > package.json
          npm_cli="${RUNNER_TEMP}/annotations-publisher/source/bin/npm-cli.js"
          node "$npm_cli" install --ignore-scripts --omit=optional --no-audit --no-fund \
            "@ponchia/annotations@$RELEASE_VERSION"
          # npm audit checks cryptographic registry, publish and Sigstore
          # attestations. The helper then checks the signed source identity.
          node "$npm_cli" audit signatures --json --include-attestations \
            > "${RUNNER_TEMP}/npm-verified-attestations.json"
          cd "$GITHUB_WORKSPACE"
          node scripts/verify-published-provenance.mjs \
            "${RUNNER_TEMP}/npm-verified-attestations.json" \
            "${RUNNER_TEMP}/confirmed-metadata.json" \
            "$RELEASE_TAG" "$RELEASE_COMMIT" \
            > "${RUNNER_TEMP}/verified-source.json"

      - name: Verify existing release assets and add only missing matching files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
          UPLOAD_ASSETS: ${{ inputs.upload }}
        run: |
          set -euo pipefail
          args=("${RUNNER_TEMP}/confirmed-metadata.json"
            "${RUNNER_TEMP}/published-package.tgz"
            "${RUNNER_TEMP}/npm-verified-attestations.json"
            "$RELEASE_TAG" "$RELEASE_COMMIT")
          if [ "$UPLOAD_ASSETS" != true ]; then args+=(--dry-run); fi
          node scripts/mirror-release-assets.mjs "${args[@]}" \
            | tee "${RUNNER_TEMP}/verified-release-assets.json"
          {
            echo '## Original signed release assets'
            echo 'Registry bytes, cryptographic npm signatures and signed source identity were verified before planning or uploading assets.'
            echo 'No npm publish, re-signing, tag movement, asset replacement or permission change was performed.'
            echo '```json'
            cat "${RUNNER_TEMP}/verified-release-assets.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
