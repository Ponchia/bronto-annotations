name: Publishing tooling preflight

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit actual publisher bundle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          package-manager-cache: false
      - name: Install and audit isolated publisher candidate
        env:
          npm_config_cache: ${{ runner.temp }}/publisher-audit-cache
        run: |
          set -euo pipefail
          tooling="${RUNNER_TEMP}/publisher-audit"
          mkdir -p "$tooling"
          printf '%s\n' '{"name":"publisher-audit","private":true}' > "$tooling/package.json"
          npm install --prefix "$tooling" --ignore-scripts --no-audit --no-fund --save-exact --registry=https://registry.npmjs.org npm@11.21.1
          node scripts/audit-publishing-tooling.mjs "$tooling" "${RUNNER_TEMP}/publisher-audit.json"
      - name: Retain publisher audit even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: publisher-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/publisher-audit.json*
            ${{ runner.temp }}/publisher-audit/package-lock.json
          if-no-files-found: warn
          retention-days: 14
