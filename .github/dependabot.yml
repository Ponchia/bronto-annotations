version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        update-types:
          - minor
          - patch
        patterns:
          - "@types/*"
          - typescript
          - vite
          - vitest
          - playwright
      optional-peers:
        update-types:
          - minor
          - patch
        patterns:
          - react
          - react-dom
          - vega
          - mermaid
          - "@terrastruct/d2"
          - "@xyflow/react"
    # Major tooling updates remain separate from the Node 20-compatible
    # default verification stack. Mermaid 12, TypeScript 7, Vitest 5 and
    # jsdom 30 have isolated newer-runtime lanes; merging their versions into
    # the default dev dependencies still needs an explicit support decision.
    # This filters routine version updates, not Dependabot security alerts.
    ignore:
      # Axe 4.14 raised its Node floor to 22.12. Keep the full Node 20
      # verification contract until the support transition tracked in #66.
      - dependency-name: "@axe-core/playwright"
        versions: [">=4.14.0"]
      - dependency-name: mermaid
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: jsdom
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /.github/tooling/npm
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    # Review the CLI major and canary manifest hashes together.
    ignore:
      - dependency-name: npm
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
